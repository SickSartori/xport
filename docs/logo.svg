<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-label="xport: the shared runtime of native Xbox ports">
  <defs>
    <linearGradient id="green" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0e6b0e"/>
      <stop offset="1" stop-color="#56d364"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aff5b4"/>
      <stop offset="1" stop-color="#56d364"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#e6edf3" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="card"><rect width="720" height="240" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="720" height="240" fill="url(#bg)"/>
    <rect width="720" height="240" fill="url(#grid)"/>
    <circle cx="115" cy="120" r="170" fill="url(#glow)"/>
  </g>

  <!-- The icon: a controller inside a PC screen -->
  <rect x="40" y="45" width="150" height="150" rx="36" fill="url(#green)"/>
  <rect x="58" y="68" width="114" height="78" rx="11" fill="#0d1117"/>
  <rect x="104" y="146" width="22" height="13" fill="#0d1117"/>
  <rect x="86" y="158" width="58" height="9" rx="4.5" fill="#0d1117"/>
  <g transform="translate(70 77) scale(0.9)">
    <path d="M30 8C22 8 14 10 10 20L2 46C-1 56 8 62 15 56L26 44C28 42 30 41 33 41H67C70 41 72 42 74 44L85 56C92 62 101 56 98 46L90 20C86 10 78 8 70 8C66 8 64 11 60 11H40C36 11 34 8 30 8Z" fill="url(#pad)"/>
    <circle cx="26" cy="22" r="6.5" fill="#0d1117"/>
    <circle cx="26" cy="22" r="3" fill="#7ee787"/>
    <circle cx="62" cy="32" r="5.5" fill="#0d1117"/>
    <circle cx="62" cy="32" r="2.5" fill="#7ee787"/>
    <path d="M38 28v9M33.5 32.5h9" stroke="#0d1117" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="50" cy="19" r="3.2" fill="#0d1117"/>
    <circle cx="75" cy="16.5" r="2.6" fill="#0d1117"/>
    <circle cx="75" cy="27.5" r="2.6" fill="#0d1117"/>
    <circle cx="69.5" cy="22" r="2.6" fill="#0d1117"/>
    <circle cx="80.5" cy="22" r="2.6" fill="#0d1117"/>
  </g>

  <text x="220" y="112" font-family="'Segoe UI Variable Display', 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="74" font-weight="800" fill="#f0f6fc" letter-spacing="-2.5"><tspan fill="#56d364">x</tspan>port</text>
  <text x="223" y="146" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21"
        fill="#9198a1">The shared runtime of native Xbox ports</text>

  <g font-family="'Cascadia Code', Consolas, 'SF Mono', monospace" font-size="14" fill="#7ee787">
    <rect x="222" y="166" width="142" height="30" rx="15" fill="#56d364" fill-opacity="0.12" stroke="#56d364" stroke-opacity="0.45"/>
    <text x="293" y="186" text-anchor="middle">Xbox → Windows</text>
    <rect x="374" y="166" width="176" height="30" rx="15" fill="#56d364" fill-opacity="0.12" stroke="#56d364" stroke-opacity="0.45"/>
    <text x="462" y="186" text-anchor="middle">NV2A → Direct3D 11</text>
    <rect x="560" y="166" width="110" height="30" rx="15" fill="#56d364" fill-opacity="0.12" stroke="#56d364" stroke-opacity="0.45"/>
    <text x="615" y="186" text-anchor="middle">native x86</text>
  </g>
</svg>
